apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply from: "$rootDir/addAllTargets.gradle"
apply from: "$rootDir/publish.gradle"
apply plugin: 'com.jakewharton.mosaic.build'

mosaicBuild {
	patchJavaModuleWithKotlinClasses('mosaic.tty.terminal')
}

kotlin {
	// Linux and macOS share the POSIX signal-driven finalization which Windows lacks.
	applyDefaultHierarchyTemplate {
		it.common {
			it.group("native") {
				it.group("posix") {
					it.group("linux") {}
					it.group("macos") {}
				}
			}
		}
	}

	explicitApi()

	sourceSets {
		configureEach {
			languageSettings {
				optIn("kotlin.contracts.ExperimentalContracts")
				optIn('kotlinx.cinterop.ExperimentalForeignApi')
			}
			if (it.name.endsWith("Test")) {
				languageSettings {
					optIn('kotlin.ExperimentalStdlibApi')
				}
			}
		}

		commonMain {
			dependencies {
				api libs.kotlinx.coroutines.core
				api projects.mosaicTerminal
				api projects.mosaicTty
				implementation libs.finalizationHook
			}
		}
		nativeMain {
			dependencies {
				// Provides the blocking, reentrant lock which the JVM gets from java.util.concurrent.
				implementation libs.kotlinx.atomicfu
			}
		}
		commonTest {
			dependencies {
				implementation libs.kotlin.test
				implementation libs.kotlinx.coroutines.test
				implementation libs.kotlinx.io.core
				implementation libs.assertk
			}
		}
	}
}
